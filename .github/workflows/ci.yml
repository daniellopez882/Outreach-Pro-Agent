name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outreach-architect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: outreach-architect/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        env:
          ENVIRONMENT: testing
          API_KEY: ci-test-key-not-real
        run: pytest --cov=. --cov-report=term-missing

      - name: No credential-scraping settings may return
        # The LinkedIn scraper was removed for being both non-functional and a
        # terms-of-service breach. This fails the build if it comes back.
        run: |
          if grep -rIl --exclude-dir=.venv --exclude-dir=docs \
               -e 'LINKEDIN_PASSWORD' -e 'linkedin_password' . ; then
            echo "::error::LinkedIn credential settings reintroduced; see docs/data-sourcing.md"
            exit 1
          fi
          echo "clean"

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: outreach-architect
          push: false
          load: true
          tags: outreach-architect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves /health
        run: |
          docker run -d --name oa-ci -p 8000:8000 \
            -e ENVIRONMENT=development -e API_KEY=ci-key \
            outreach-architect:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; curl -fsS http://localhost:8000/health; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"; docker logs oa-ci; exit 1

      - name: The send endpoint rejects unauthenticated callers
        # It delivers email through the configured SendGrid account.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/campaigns/1/send)
          echo "unauthenticated POST /campaigns/1/send -> $code"
          [ "$code" = "401" ] || { echo "::error::send endpoint is not protected"; exit 1; }

      - name: Image does not run as root
        run: |
          user=$(docker run --rm --entrypoint sh outreach-architect:ci -c 'id -un')
          echo "runs as: $user"
          [ "$user" != "root" ] || { echo "::error::image runs as root"; exit 1; }

      - name: Clean up
        if: always()
        run: docker rm -f oa-ci || true
